<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1080px; height: 1350px; background: #FBFAF7; color: #1C1A17;
         font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; }
  .wrap { padding: 92px 84px 0; }
  .kick { font-size: 34px; font-weight: 700; color: #6B655C; letter-spacing: 1px; }
  h1 { font-size: 88px; line-height: 1.22; margin: 14px 0 0; font-weight: 900; }
  h1 b { color: #A4432F; }
  .stat { margin-top: 30px; font-size: 38px; line-height: 1.55; color: #3B3833; }
  .stat b { color: #A4432F; }
  .list { margin-top: 40px; border-top: 4px solid #1C1A17; }
  .item { padding: 26px 0 24px; border-bottom: 2px solid #E4E0D8; display: flex; gap: 24px; align-items: flex-start; }
  .tag { flex: none; font-size: 27px; font-weight: 900; padding: 8px 18px; border-radius: 10px; margin-top: 4px; }
  .ok { color: #7A5A18; background: #F6EBD2; }
  .no { color: #A4432F; background: #F7E3DE; }
  .name { font-size: 37px; font-weight: 900; }
  .why { font-size: 29px; margin-top: 8px; line-height: 1.5; color: #3B3833; }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 64px; display: flex; justify-content: space-between;
          font-size: 26px; color: #8A8378; }
</style></head>
<body>
  <div class="wrap">
    <div class="kick">貓砂直接倒馬桶的先看</div>
    <h1>寫可沖馬桶的<br>有的沖了<b>會塞</b></h1>
    <div class="stat">讀過的 14 款裡只有 <b>7 款適量可以沖</b>，<br>而那 7 款的包裝，全部都寫「可沖馬桶」</div>
    <div class="list">
      <div class="item">
        <div class="tag ok">適量可沖</div>
        <div>
          <div class="name">豆腐砂・木薯砂・稻殼砂</div>
          <div class="why">植物纖維，遇水會散開。一次一小坨，整盆倒一樣塞</div>
        </div>
      </div>
      <div class="item">
        <div class="tag no">不能沖</div>
        <div>
          <div class="name">木屑砂</div>
          <div class="why">遇水是散開，但體積變大、比重輕，容易卡在管線轉彎處</div>
        </div>
      </div>
      <div class="item">
        <div class="tag no">不能沖</div>
        <div>
          <div class="name">礦砂・沸石・水晶</div>
          <div class="why">遇水結成一團，而且不溶於水</div>
        </div>
      </div>
      <div class="item">
        <div class="tag no">要看成分</div>
        <div>
          <div class="name">混合砂</div>
          <div class="why">同一個牌子有的能沖有的不能，差在有沒有摻膨潤土</div>
        </div>
      </div>
    </div>
  </div>
  <div class="foot"><span>照各品牌的材質標示，2026 年 9 月</span><span>zone27.com.tw</span></div>
</body></html>
