<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1080px; height: 1350px; background: #FBFAF7; color: #1C1A17;
         font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; }
  .wrap { padding: 74px 84px 0; }
  .kick { font-size: 34px; font-weight: 700; color: #6B655C; letter-spacing: 1px; }
  h1 { font-size: 76px; line-height: 1.22; margin: 14px 0 0; font-weight: 900; }
  h1 b { color: #A4432F; }
  .stat { margin-top: 24px; font-size: 33px; line-height: 1.55; color: #3B3833; }
  .rows { margin-top: 32px; border-top: 4px solid #1C1A17; }
  .r { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
       padding: 21px 0 19px; border-bottom: 2px solid #E4E0D8; }
  .n { font-size: 34px; font-weight: 800; }
  .n span { display: block; font-size: 24px; color: #6B655C; font-weight: 600; margin-top: 6px; }
  .p { font-size: 42px; font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cheap .p { color: #2F6B4F; }
  .dear .p { color: #A4432F; }
  .note { margin-top: 26px; font-size: 28px; line-height: 1.6; color: #3B3833; }
  .note b { color: #A4432F; }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 60px; display: flex; justify-content: space-between;
          font-size: 25px; color: #8A8378; }
</style></head>
<body>
  <div class="wrap">
    <div class="kick">覺得礦砂最便宜的先看</div>
    <h1>一個月的貓砂錢<br>差到<b>快五百</b></h1>
    <div class="stat">標價比不出貴不貴：礦砂論公斤、豆腐砂論公升。<br>全部換算成「一隻貓一個月花多少」之後</div>
    <div class="rows">
      <div class="r cheap">
        <div class="n">pidan 混合砂　經典版<span>混合砂・不能沖馬桶</span></div>
        <div class="p">$400</div>
      </div>
      <div class="r">
        <div class="n">汪喵　米粒型豆腐砂<span>豆腐砂・適量可沖</span></div>
        <div class="p">$517</div>
      </div>
      <div class="r">
        <div class="n">pidan 純木薯砂<span>木薯砂・適量可沖</span></div>
        <div class="p">$554</div>
      </div>
      <div class="r">
        <div class="n">臭味滾　極細豆腐砂<span>豆腐砂・適量可沖</span></div>
        <div class="p">$573</div>
      </div>
      <div class="r dear">
        <div class="n">藍鑽　藍標 4 倍淨味<span>礦砂・不能沖馬桶</span></div>
        <div class="p">$877</div>
      </div>
    </div>
    <div class="note">最便宜的那款<b>不能沖馬桶</b>。同牌子的純木薯砂可以沖，一個月多 $154</div>
  </div>
  <div class="foot"><span>用量照材質推估，每隻貓不同・2026 年 9 月</span><span>zone27.com.tw</span></div>
</body></html>
