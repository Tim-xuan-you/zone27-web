<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1080px; height: 1350px; background: #FBFAF7; color: #1C1A17;
         font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; }
  .wrap { padding: 76px 84px 0; }
  .kick { font-size: 34px; font-weight: 700; color: #6B655C; letter-spacing: 1px; }
  h1 { font-size: 78px; line-height: 1.22; margin: 14px 0 0; font-weight: 900; }
  h1 b { color: #A4432F; }
  .stat { margin-top: 22px; font-size: 36px; line-height: 1.55; color: #3B3833; }
  .stat b { color: #A4432F; }
  .list { margin-top: 30px; border-top: 4px solid #1C1A17; }
  .item { padding: 18px 0 16px; border-bottom: 2px solid #E4E0D8; }
  .brand { font-size: 27px; color: #6B655C; font-weight: 700; }
  .name { font-size: 38px; font-weight: 900; margin-top: 2px; }
  .row { font-size: 31px; margin-top: 8px; line-height: 1.5; color: #3B3833; }
  .row .k { display: inline-block; width: 150px; color: #8A8378; font-weight: 700; }
  .row .chk { color: #A4432F; font-weight: 900; }
  .row .ok { color: #2F6B55; font-weight: 900; }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 60px; display: flex; justify-content: space-between;
          font-size: 26px; color: #8A8378; }
</style></head>
<body>
  <div class="wrap">
    <div class="kick">要幫狗換肉、做排除飲食的先看</div>
    <h1>名字寫鹿肉、鱉肉<br>第一二項是<b>雞</b></h1>
    <div class="stat">台灣買得到的 12 款狗主食罐，<br>名字沒寫雞的 5 款裡，<b>4 款有雞</b></div>
    <div class="list">
      <div class="item">
        <div class="brand">汪喵星球</div>
        <div class="name">犬用 Fantastic 95% 鮮肉主食罐　鹿肉</div>
        <div class="row"><span class="k">成分表</span>第 1 項鹿肉，第 2 到 5 項全是 <span class="chk">雞</span></div>
      </div>
      <div class="item">
        <div class="brand">怪獸部落</div>
        <div class="name">犬2肉主食罐　鱉肉鱉蛋</div>
        <div class="row"><span class="k">成分表</span>第 1 項就是 <span class="chk">雞肉</span></div>
      </div>
      <div class="item">
        <div class="brand">汪喵星球</div>
        <div class="name">熟齡犬銀養主食罐　燉羊肉</div>
        <div class="row"><span class="k">成分表</span>第 1 項 <span class="chk">雞肉及雞肝</span>，羊肉排第 2</div>
      </div>
      <div class="item">
        <div class="brand">怪獸部落</div>
        <div class="name">犬1肉主食罐　鴨肉</div>
        <div class="row"><span class="k">成分表</span>肉只有鴨肉、鴨肝，<span class="ok">找不到雞</span></div>
      </div>
    </div>
  </div>
  <div class="foot"><span>照台灣通路的中文標示，2026 年 9 月</span><span>zone27.com.tw</span></div>
</body></html>
