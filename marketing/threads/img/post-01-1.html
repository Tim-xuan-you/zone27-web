<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1080px; height: 1350px; background: #FBFAF7; color: #1C1A17;
         font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; }
  .wrap { padding: 92px 84px 0; }
  .kick { font-size: 34px; font-weight: 700; color: #6B655C; letter-spacing: 1px; }
  h1 { font-size: 88px; line-height: 1.22; margin: 14px 0 0; font-weight: 900; }
  h1 b { color: #A4432F; }
  .stat { margin-top: 30px; font-size: 38px; line-height: 1.55; color: #3B3833; }
  .stat b { color: #A4432F; }
  .list { margin-top: 44px; border-top: 4px solid #1C1A17; }
  .item { padding: 30px 0 28px; border-bottom: 2px solid #E4E0D8; }
  .brand { font-size: 28px; color: #6B655C; font-weight: 700; }
  .name { font-size: 40px; font-weight: 900; margin-top: 4px; }
  .row { font-size: 32px; margin-top: 10px; line-height: 1.5; color: #3B3833; }
  .row .k { display: inline-block; width: 150px; color: #8A8378; font-weight: 700; }
  .row .chk { color: #A4432F; font-weight: 900; }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 64px; display: flex; justify-content: space-between;
          font-size: 26px; color: #8A8378; }
</style></head>
<body>
  <div class="wrap">
    <div class="kick">對雞過敏的毛孩先看</div>
    <h1>名字沒寫雞<br>成分表裡<b>有雞</b></h1>
    <div class="stat">台灣買得到的 58 款飼料、罐頭，<br>名字沒寫雞的 42 款裡，<b>12 款有雞</b></div>
    <div class="list">
      <div class="item">
        <div class="brand">Sheba 希寶</div>
        <div class="name">鮮饌包　鮪魚＋鮭魚</div>
        <div class="row"><span class="k">成分表</span>扣掉水，第一個肉就是 <span class="chk">雞肉</span></div>
      </div>
      <div class="item">
        <div class="brand">TOMA-PRO 優格</div>
        <div class="name">成犬　羊肉＋米</div>
        <div class="row"><span class="k">成分表</span>第 2 項 <span class="chk">乾燥雞肉</span>，油也是 <span class="chk">雞脂</span></div>
      </div>
      <div class="item">
        <div class="brand">汪喵星球</div>
        <div class="name">98% 鮮肉無膠主食罐　低敏鴨肉</div>
        <div class="row"><span class="k">成分表</span>第 2 項 <span class="chk">雞肉</span>、第 3 項 <span class="chk">雞心肝</span></div>
      </div>
    </div>
  </div>
  <div class="foot"><span>照各品牌的台灣中文標示，2026 年 9 月</span><span>zone27.com.tw</span></div>
</body></html>
